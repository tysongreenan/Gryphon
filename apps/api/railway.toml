[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Used if the platform falls back to Railpack/Nixpacks instead of the Dockerfile.
startCommand = "sh -c 'mkdir -p /data && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
